<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de hash — O Cofre</title>
<meta name="robots" content="noindex">
<style>
body{background:#07070a;color:#ececf0;font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:28px 16px}
h1{font-size:22px}p{color:#9a9aa6;font-size:14px;line-height:1.5}
input{width:100%;box-sizing:border-box;background:#111116;border:1px solid #2a2a33;color:#fff;font:600 18px ui-monospace,monospace;padding:14px;border-radius:8px;margin:10px 0}
.o{background:#111116;border:1px solid #2a2a33;border-radius:8px;padding:12px;font:13px ui-monospace,monospace;word-break:break-all;margin:6px 0 14px}
label{font-size:12px;color:#ecdd1e;letter-spacing:.1em}
</style>
</head>
<body>
<h1>Gerador de hash do Cofre</h1>
<p>Corre só no teu browser: nada é enviado para lado nenhum. Escreve a resposta final, copia o <b>HASH</b> e manda-o ao Claude. A resposta nunca sai daqui.</p>
<input id="i" placeholder="resposta final" autocomplete="off" spellcheck="false">
<label>COMO O COFRE A LÊ</label><div class="o" id="n">—</div>
<label>HASH (enviar)</label><div class="o" id="h">—</div>
<label>CÓDIGO DE VENCEDOR (guardar para validar)</label><div class="o" id="w">—</div>
<p id="warn"></p>
<script>
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().split(' ').filter(w=>w&&!['O','A','OS','AS'].includes(w)).join('');
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('i').addEventListener('input',async e=>{
  const a=norm(e.target.value);
  document.getElementById('n').textContent=a||'—';
  document.getElementById('h').textContent=a?await sha('LGCOFRE1|'+a):'—';
  document.getElementById('w').textContent=a?(await sha('LGWIN|'+a)).slice(0,8).toUpperCase():'—';
  const ok=a.length>=12&&/[0-9]/.test(a)&&/[A-Z]/.test(a);
  document.getElementById('warn').textContent=a?(ok?'✓ Forte o suficiente.':'⚠ Fraca: usa 12+ caracteres com letras e números.'):'';
});
</script>
</body>
</html>
